name: CI

# Secretless validation on every push/PR. release.yml stays tag-only because it
# needs signing material.
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-ui:
    name: web-ui (typecheck, lint, format)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npx oxlint app

      - name: Format check
        run: npx oxfmt app --check

      - name: Build
        run: npm run build

  android:
    name: android (compile + unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      # compileStableDebugKotlin covers every :app source set without needing
      # the keystore, the bundled web UI, or an emulator.
      - name: Compile app
        run: ./gradlew --no-daemon :app:compileStableDebugKotlin

      # continue-on-error: three suites fail at HEAD, before this workflow
      # existed. Blocking on them would make CI permanently red and get ignored.
      #   - LocalizationAuditTest: zh-Hans is missing 322 keys, ar 379 (needs
      #     real translation work, not a cleanup task)
      #   - ModelCatalogTest.testSetupModelsResolveThroughFamilyFirstCatalog:
      #     four Relay Gateway setup refs do not resolve
      # Remove this line once all three are green so regressions start blocking.
      - name: Unit tests (allow known failures)
        continue-on-error: true
        run: ./gradlew --no-daemon :ai:testDebugUnitTest :app:testStableDebugUnitTest

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 7
